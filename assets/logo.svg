<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Kakashi 拷贝忍者头像">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2937"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f2f6fa"/>
      <stop offset="0.55" stop-color="#cfd8e1"/>
      <stop offset="1" stop-color="#9aa6b4"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3bfca"/>
      <stop offset="1" stop-color="#6d7a88"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d4b0"/>
      <stop offset="1" stop-color="#e6b689"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3d4f66"/>
      <stop offset="1" stop-color="#0b1016"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="235" r="235" fill="url(#glow)" opacity="0.6"/>

    <g transform="translate(256 276) scale(1.06) translate(-256 -276)">
      <!-- 肩线 -->
      <path d="M6 512 C 66 462, 152 442, 256 442 C 360 442, 446 462, 506 512 Z" fill="#131c26"/>
      <path d="M6 512 C 66 462, 152 442, 256 442 C 360 442, 446 462, 506 512"
            fill="none" stroke="#2a3847" stroke-width="5"/>

      <!-- 头发 -->
      <path d="M104 344
               C 84 272, 80 214, 96 182
               L 62 194 L 92 146 L 70 108 L 128 118 L 120 70 L 168 96 L 176 42
               L 222 88 L 246 30 L 288 84 L 320 34 L 344 96 L 396 62 L 392 120
               L 446 100 L 424 158 L 470 160 L 430 208
               C 448 258, 444 300, 428 344 Z"
            fill="url(#hair)"/>

      <!-- 脸 -->
      <path d="M126 320 C 126 225, 172 165, 256 165 C 340 165, 386 225, 386 320
               L 386 372 C 386 424, 338 452, 256 452 C 174 452, 126 424, 126 372 Z"
            fill="url(#skin)"/>

      <!-- 面罩 -->
      <path d="M126 364 Q 256 330 386 364 L 386 372 C 386 424, 338 452, 256 452
               C 174 452, 126 424, 126 372 Z"
            fill="#243449"/>
      <path d="M126 364 Q 256 330 386 364" fill="none" stroke="#141d27" stroke-width="5"/>

      <!-- 护额布带 -->
      <rect x="136" y="196" width="240" height="60" rx="12" fill="#18212e"/>
      <path d="M136 250 H 376" stroke="#101822" stroke-width="6"/>

      <!-- 护额金属牌 -->
      <rect x="202" y="186" width="118" height="78" rx="10" fill="url(#plate)" stroke="#55626f" stroke-width="4"/>
      <path d="M214 200 L 226 200 L 214 220 Z" fill="#ffffff" opacity="0.28"/>
      <path d="M261 208 a20 20 0 1 0 20 20 a14 14 0 1 1 -14 -14 a7 7 0 1 0 7 7"
            fill="none" stroke="#2b3642" stroke-width="6" stroke-linecap="round"/>

      <!-- 眉毛 -->
      <path d="M172 284 Q 204 268 240 279" fill="none" stroke="#aab5c1" stroke-width="10" stroke-linecap="round"/>
      <path d="M272 279 Q 308 268 340 284" fill="none" stroke="#aab5c1" stroke-width="10" stroke-linecap="round"/>

      <!-- 眼睛 -->
      <ellipse cx="206" cy="316" rx="34" ry="20" fill="#ffffff"/>
      <path d="M172 298 Q 206 279 240 298" fill="none" stroke="#2a3441" stroke-width="6" stroke-linecap="round"/>
      <circle cx="213" cy="316" r="14" fill="#1b2430"/>
      <circle cx="208" cy="311" r="5" fill="#ffffff"/>

      <ellipse cx="306" cy="316" rx="34" ry="20" fill="#ffffff"/>
      <path d="M272 298 Q 306 279 340 298" fill="none" stroke="#2a3441" stroke-width="6" stroke-linecap="round"/>
      <circle cx="309" cy="316" r="14" fill="#1b2430"/>
      <circle cx="304" cy="311" r="5" fill="#ffffff"/>

      <!-- 面罩褶皱 -->
      <path d="M170 400 Q 200 386 232 398" fill="none" stroke="#2f4460" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <path d="M282 398 Q 314 386 344 400" fill="none" stroke="#2f4460" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

      <!-- 布带下的阴影 -->
      <path d="M126 302 Q 256 324 386 302 L 386 322 Q 256 346 126 322 Z" fill="#000000" opacity="0.10"/>
    </g>
  </g>

  <circle cx="256" cy="256" r="252" fill="none" stroke="#d7443e" stroke-width="8"/>
</svg>
